ueen_mary2_hf_2010", "certainty": "reported_action", "props": {"name": "应对", "graph_version": "4.0", "is_causal": false}, "caption": "应对", "certainty_zh": "报告行动/建议"}, "edge:ff8cce45e75fb388": {"id": "edge:ff8cce45e75fb388", "source": "shipkg:component:0dcadce61c82", "relation": "BELONGS_TO_SYSTEM", "target": "shipkg:subsystem:52e7560c8465", "evidence_id": "ev:9c5f7101c8442b54", "case_id": "", "certainty": "curated_classification", "props": {"classification_rule": "fuel_air", "name": "归属系统", "graph_version": "4.0", "is_causal": false, "legacy_relation": "BELONGS_TO_SUBSYSTEM"}, "caption": "归属系统", "certainty_zh": "研究者分类（非因果结论）"}, "edge:ffd0b2d7d280b726": {"id": "edge:ffd0b2d7d280b726", "source": "shipkg:condition:6fa538170906", "relation": "BELONGS_TO_SYSTEM", "target": "shipkg:subsystem:d08eaf16cc46", "evidence_id": "ev:1b6ee0d38c733128", "case_id": "", "certainty": "curated_classification", "props": {"classification_rule": "lubrication", "name": "归属系统", "graph_version": "4.0", "is_causal": false, "legacy_relation": "BELONGS_TO_SUBSYSTEM"}, "caption": "归属系统", "certainty_zh": "研究者分类（非因果结论）"}}, "evidence": {"ev:008f983201b4fd11": {"id": "ev:008f983201b4fd11", "source_file": "MAIB_2013_Safety_Digest_lubrication_bearing_cases.pdf", "source_url": "https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/876748/2013-SD2-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "14", "locator": "PDF page 14", "quote": "he bottom end bearing had overheated and failed (see figure). No1 compressor was isolated but the engineers soon noticed that the air pressure in the main air receiver was dropping. Shortly afterwards, the centre main engine was started and all three main engines were put on standby in preparation for entering port. During this period, multiple alarms sounded in the ECR warning of low control air pressure."}, "ev:01e497b491874531": {"id": "ev:01e497b491874531", "source_file": "MAIB_2026_10_Kommandor_Susan_generator_bearing_failure.pdf", "source_url": "https://www.gov.uk/maib-reports/catastrophic-engine-failure-and-subsequent-fire-on-board-the-site-investigation-vessel-kommandor-susan", "source_kind": "report", "page": "8", "locator": "PDF page 8", "quote": "Caterpillar was approved on the basis that genuine parts were used. The CTP parts were designed for a standard service interval. Use of the CTP parts beyond their design life led the connecting rod bearings to fail, initiating a chain of mechanical failures that culminated in the engine failure and subsequent fire. The extended service intervals were inappropriate for these substitute components, accelerating the risk of failure. Anchoring"}, "ev:01f3913bd9c46899": {"id": "ev:01f3913bd9c46899", "source_file": "MAIB_2026_10_Kommandor_Susan_generator_bearing_failure.pdf", "source_url": "https://www.gov.uk/maib-reports/catastrophic-engine-failure-and-subsequent-fire-on-board-the-site-investigation-vessel-kommandor-susan", "source_kind": "report", "page": "1", "locator": "PDF page 1", "quote": "f Forth, Scotland on 25 January 2025 SUMMARY At 1305 on 25 January 2025, the site investigation vessel Kommandor Susan suffered a catastrophic failure of a diesel generator engine while conducting sea trials in the Firth of Forth, Scotland. The failure resulted in an engine room fire and a complete power blackout. The crew responded promptly, extinguished the fire and mustered safely. The vessel lost propu"}, "ev:023a00d310521c01": {"id": "ev:023a00d310521c01", "source_file": "Marine_Engine_Fault_Data_v1.zip", "source_url": "https://zenodo.org/records/19857425", "source_kind": "dataset", "page": "", "locator": "variable_dictionary.csv:Shaft Torque", "quote": "full_name=Shaft Torque; symbol=Tq; unit=Nm; dtype=number; in_reference=TRUE; in_scenario_files=TRUE; category=other"}, "ev:04e94cee9be565df": {"id": "ev:04e94cee9be565df", "source_file": "Marine_Engine_Fault_Data_v1.zip", "source_url": "https://zenodo.org/records/19857425", "source_kind": "dataset", "page": "", "locator": "dataset_index.csv:AF_Clogging/AF_Clogging_40_Load.csv", "quote": "file_name=AF_Clogging/AF_Clogging_40_Load.csv; schema_type=scenario; scenario=Air-filter clogging (compressor); nominal_load=40%; severity_or_program=single load condition; header_rows=3; data_rows=4820; columns=73; anomaly_state=binary (0=pre-anomaly, 1=anomaly); notes=Pre-anomaly and anomaly segments."}, "ev:0523deba67297b7c": {"id": "ev:0523deba67297b7c", "source_file": "MAN_SL2013_569_bearing_wear_monitoring.pdf", "source_url": "https://www.man-es.com/docs/default-source/service-letters/sl2013-569.pdf", "source_kind": "manufacturer_guidance", "page": "2", "locator": "PDF page 2", "quote": "C A main bearing damage was recently experienced on an MAN B&W S-MC-C main engine of medium bore size. The damage was caused by a sudden ingress of foreign matter into the bearing via the lubricating oil system, and it devel - oped rapidly into a bearing seizure. The engine was equipped with a bearing wear monitoring (BWM) system as recommended by MAN Diesel & Turbo (MDT). However, for rea"}, "ev:05847d350f09dacc": {"id": "ev:05847d350f09dacc", "source_file": "MAIB_2016_Safety_Digest_generator_oil_fire.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/5e81e5d2d3bf7f13416961fa/2016-SD1-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "26", "locator": "PDF page 26", "quote": "eak oil that had been sprayed on the exhaust casing of the adjacent engine caught fire. Fortunately the crew were able to quickly identify and isolate the source of the leak and extinguish the fire before it was able to spread. No one was hurt in the incident. Subsequent investigation revealed that: • The oil had come from a loose plug on the generator’s engine-mounted lubricating oil pump (Figure 2a"}, "ev:069c961d11b53b1c": {"id": "ev:069c961d11b53b1c", "source_file": "MAIB_2016_Safety_Digest_generator_oil_fire.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/5e81e5d2d3bf7f13416961fa/2016-SD1-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "60", "locator": "PDF page 60", "quote": "l sensors from the wheelhouse as he made his way to the liferaft. Once in the liferaft the crew cut the painter and watched their vessel sink in deep water as they drifted away (Figure 1) After spending an hour in the liferaft the crew were rescued by the crew of a vessel that had responded to the “Mayday” relay message. They were later transferred ashore, unharmed, by a rescue heli"}, "ev:06bb917f36e1db67": {"id": "ev:06bb917f36e1db67", "source_file": "MAN_SL2013_569_bearing_wear_monitoring.pdf", "source_url": "https://www.man-es.com/docs/default-source/service-letters/sl2013-569.pdf", "source_kind": "manufacturer_guidance", "page": "2", "locator": "PDF page 2", "quote": "BWM system. • 58 minutes passed from the initial stage of the seizure until the alarm set off and slow-down was requested by the OMD system. The BWM specification issued by MDT was updated in 2011 to enable early detection of a sudden and rapidly Fig. 2: Sequence of alarms developing damage like the one mentioned above. The system fitted to the engine in question was"}, "ev:085bb3fe51ea11cc": {"id": "ev:085bb3fe51ea11cc", "source_file": "MAIB_2016_Safety_Digest_generator_oil_fire.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/5e81e5d2d3bf7f13416961fa/2016-SD1-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "29", "locator": "PDF page 29", "quote": "head. Despite placing the pitch control to full astern, the CPP did not respond in time and the vessel’s bow struck the quay. The bulbous bow was holed, but fortunately the damage was above the waterline (Figure 1). The subsequent investigation identified that the vessel had a history of sluggish astern response. However, the crew had accepted this as a ‘characteristic’ of the v"}, "ev:0917ec321d12afd2": {"id": "ev:0917ec321d12afd2", "source_file": "MAIB_2024_20_Stena_Europe_fuel_spray_fire.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/6756db0ba63e1781efb87793/2024-20-StenaEurope.pdf", "source_kind": "report", "page": "32", "locator": "PDF page 32", "quote": "ght the hazards of entering a fire-damaged space without the correct personal protective equipment. 2024/174 Introduce the use of thermal imaging cameras to all Stena vessels with appropriate functionality for the detection of exposed hot surfaces of over 220°C within machinery spaces. Safety recommendations shall in no case create a presumption of blame or liability."}, "ev:09940c64e5709cec": {"id": "ev:09940c64e5709cec", "source_file": "MAIB_2013_Safety_Digest_lubrication_bearing_cases.pdf", "source_url": "https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/876748/2013-SD2-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "21", "locator": "PDF page 21", "quote": "n-line filter chamber, and the engine lubricating oil system was contaminated. The contamination caused main bearing seizure, the rotation of bearing shells and the blockage of oil ways, and subsequent oil starvation and overheating to other bearings and to the pistons. The engine daily logs referred to oil filter cartridge changes only prior to the repair to the oil pumps. They also showed that the pressure rea"}, "ev:0aa614f9faf8b6fd": {"id": "ev:0aa614f9faf8b6fd", "source_file": "MAN_SL2016_623_cooling_water.pdf", "source_url": "https://www.man-es.com/docs/default-source/service-letters/sl2016-623.pdf", "source_kind": "manufacturer_guidance", "page": "2", "locator": "PDF page 2", "quote": "e - duce the lifetime and safety of the engine components. Lime- scale as well as rust deposits will reduce the heat transfer and may result in thermal overload of the components to be cooled by the engine cooling water. A thermal overload may, however, also result in cracks and leakages as seen in the exhaust valve seat ring. Insufficient cooling water flow has widespread consequenc - e"}, "ev:0b7a42308cc8b6cc": {"id": "ev:0b7a42308cc8b6cc", "source_file": "MAIB_2022_04_Wight_Sky_multiple_engine_failures.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/6267cc85e90e071690c1b679/2022-4-WightSky-Report.pdf", "source_kind": "report", "page": "84", "locator": "PDF page 84", "quote": "D OR RESULTED IN RECOMMENDATIONS 1. Wight Sky’s ME2 failed catastrophically due to a sudden loss of lubricating oil supply to its number five main journal bearing and number four crankpin. [2.3.1] 2. The oilway to the main journal and crankpin was blocked off when the bearing shells turned in their housing. Poor fuel combustion, the presence of silica sand and other abrasive particles embe"}, "ev:0bd224f4476f3548": {"id": "ev:0bd224f4476f3548", "source_file": "STAMFORD_AGN076_alternator_bearings.pdf", "source_url": "https://www.stamford-avk.com/sites/stamfordavk/files/2024-04/AGN076_C.pdf", "source_kind": "manufacturer_guidance", "page": "4", "locator": "PDF page 4", "quote": "e expected, but the bearings might well be failing for different reasons. For example; where a ball bearing might fail because of axial vibration, causing a fretting action in the housing, the cylindrical roller bearing might fail because of lack of grease or misalignment damage. The anti-friction ball bearings used on STAMFORD alternators are not insulated bearings. The design of STAMFORD alternato"}, "ev:0bf144357db6ee2f": {"id": "ev:0bf144357db6ee2f", "source_file": "TSRF_main.zip", "source_url": "https://github.com/TS-RF/TSRF", "source_kind": "code", "page": "", "locator": "data/Normal.csv", "quote": "Normal.csv"}, "ev:0c984e504147698d": {"id": "ev:0c984e504147698d", "source_file": "MAIB_2013_Safety_Digest_lubrication_bearing_cases.pdf", "source_url": "https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/876748/2013-SD2-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "23", "locator": "PDF page 23", "quote": "e not overlooked. 2. One of the advantages of completing daily logs is the ability to assess trends in the operating machinery. A consistently low reading on the filter differential oil pressure gauge, and a comparison with previous operating hours between filter changes, should have rung alarm bells that something was wrong. 3. An oil mist detector gives advance warning of an impending major failure. When a detector alarm occ"}, "ev:0e28dc346f51844d": {"id": "ev:0e28dc346f51844d", "source_file": "MAIB_2013_Safety_Digest_lubrication_bearing_cases.pdf", "source_url": "https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/876748/2013-SD2-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "41", "locator": "PDF page 41", "quote": "ifold and catch fire. The small fire then ignited the engine high temperature alarm cabling loom, causing it to short circuit and set off the alarm in the wheelhouse (Figure 2). The functional fire and smoke alarm sensors were some distance from the fire, and the smoke and heat had not migrated that far by the time the master noticed the smoke on the camera monitor."}, "ev:0e3fac9dc3cdbd8f": {"id": "ev:0e3fac9dc3cdbd8f", "source_file": "STAMFORD_AGN040_winding_insulation.pdf", "source_url": "https://www.stamford-avk.com/sites/stamfordavk/files/AGNs/AGN-040_E-Winding-Insulation-System.pdf", "source_kind": "manufacturer_guidance", "page": "6", "locator": "PDF page 6", "quote": "ce and understanding about the risk of operation of the alternator’s insulation system is required, then the next test would be a Polarization Index - PI Test. The alternator's Insulation Resistance (IR), along with many other critical factors, will have been measured during the STAMFORD | AvK factory processes of manufacture, assembly and test. The alternator will have been"}, "ev:0e5aaddc8a474eee": {"id": "ev:0e5aaddc8a474eee", "source_file": "MAIB_2016_Safety_Digest_generator_oil_fire.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/5e81e5d2d3bf7f13416961fa/2016-SD1-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "41", "locator": "PDF page 41", "quote": "ve not holding. 2. The crew’s response to the flooding was ineffective because they were not prepared for the emergency. They had never carried out an engine room flooding drill, and half of them had never carried out any form of emergency drill since joining the vessel. Are you prepared for a flooding emergency? 3. Examination of the isolating valve following the accident identified that the valve actua"}, "ev:0ec8d60206b6b9cf": {"id": "ev:0ec8d60206b6b9cf", "source_file": "MAIB_2026_10_Kommandor_Susan_generator_bearing_failure.pdf", "source_url": "https://www.gov.uk/maib-reports/catastrophic-engine-failure-and-subsequent-fire-on-board-the-site-investigation-vessel-kommandor-susan", "source_kind": "report", "page": "1", "locator": "PDF page 1", "quote": "ustered safely. The vessel lost propulsion and began drifting eastwards. Attempts to deploy anchors were unsuccessful because the anchor winches required electrical power to operate. Kommandor Susan was eventually returned to Leith harbour with limited propulsion restored. The investigation found that the engine failure was caused by premature wear of bearings fitted during a major overhaul in 2019. These co"}, "ev:0f3029c8ff2b1f75": {"id": "ev:0f3029c8ff2b1f75", "source_file": "MAIB_2013_Safety_Digest_lubrication_bearing_cases.pdf", "source_url": "https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/876748/2013-SD2-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "15", "locator": "PDF page 15", "quote": "unications between the engine room department and the bridge are imprecise or vague. Such difficulties can usually be overcome by conducting realistic machinery drills. Although such drills are often difficult to programme, they are a very good investment which, if conducted properly, will probably save time and money in the long run. 3. Check cards can be a useful aid to fault diagnosis and re"}, "ev:0f7534e3f93d98e3": {"id": "ev:0f7534e3f93d98e3", "source_file": "STAMFORD_AGN033_bearing_currents.pdf", "source_url": "https://www.stamford-avk.com/sites/stamfordavk/files/AGNs/AGN-033_C-Shaft-Bearing-Currents.pdf", "source_kind": "manufacturer_guidance", "page": "1", "locator": "PDF page 1", "quote": "porting bearings, consequently any resulting current flow will pass across the rolling element of the bearings, and will initiate electrical erosion of the bearing materials, eventually reducing the low friction expectation of the bearing. It is possible for a single bearing alternator to suffer from shaft bearing currents, but here the current flow path at the drive end of the alternator’s shaft mus"}, "ev:0fb80ad604213aad": {"id": "ev:0fb80ad604213aad", "source_file": "MAIB_2013_Safety_Digest_lubrication_bearing_cases.pdf", "source_url": "https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/876748/2013-SD2-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "21", "locator": "PDF page 21", "quote": "was contaminated. The contamination caused main bearing seizure, the rotation of bearing shells and the blockage of oil ways, and subsequent oil starvation and overheating to other bearings and to the pistons. The engine daily logs referred to oil filter cartridge changes only prior to the repair to the oil pumps. They also showed that the pressure reading on the differential pressure gauge for the"}, "ev:0fd78cc81d9681d2": {"id": "ev:0fd78cc81d9681d2", "source_file": "Marine_Engine_Fault_Data_v1.zip", "source_url": "https://zenodo.org/records/19857425", "source_kind": "dataset", "page": "", "locator": "dataset_index.csv:Injector_Nozzle/Clogged_Injector_Nozzle1_40_60_85_Load.csv", "quote": "file_name=Injector_Nozzle/Clogged_Injector_Nozzle1_40_60_85_Load.csv; schema_type=scenario; scenario=Injection-valve nozzle clogging; nominal_load=40%, 60%, 8 Anonymised vibration, lubricant and availability dataset for tugboat propulsion systems"}, "ev:1143f5b1ae869724": {"id": "ev:1143f5b1ae869724", "source_file": "MAIB_2018_01_Windcat8_bearing_failure_fire.pdf", "source_url": "https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/683922/MAIBInvReport01_2018.pdf", "source_kind": "report", "page": "9", "locator": "PDF page 9", "quote": "ation systems. Therefore, it is highly unlikely that the failure was the result of incorrect component assembly or a lack of oil. It is more likely that the failure was due to a weakness in the thin-walled shell bearing itself."}, "ev:1218b476bea8d173": {"id": "ev:1218b476bea8d173", "source_file": "MAIB_2022_04_Wight_Sky_multiple_engine_failures.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/6267cc85e90e071690c1b679/2022-4-WightSky-Report.pdf", "source_kind": "report", "page": "84", "locator": "PDF page 84", "quote": "ng caps reduced the metal-to-metal contact between surfaces of the connecting rods and their bearing caps. This would have caused fretting wear between the mating faces, which would have led to loosening and rapid failure of the end cap securing bolts. [2.3.2] 5. Four of the five catastrophic engine failures discussed in detail in this report failed suddenly because of a loss of lubrication supply to the engines’ crankshaft journal bearings and cr"}, "ev:157ede421b19ee3a": {"id": "ev:157ede421b19ee3a", "source_file": "MAIB_2013_Safety_Digest_lubrication_bearing_cases.pdf", "source_url": "https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/876748/2013-SD2-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "16", "locator": "PDF page 16", "quote": "neer. When the main engine start button was pressed to turn the engine on compressed air, a loud bang was heard; the turning gear interlock, the last remaining safety barrier, had failed to work. The resulting damage to the shaft and gearing (Figure 1) and to the turning gear casing (Figure 2) disabled the ship for a month and cost a six-figure sum to repair. To Turn or Not to Turn?"}, "ev:1637d85df75c53f0": {"id": "ev:1637d85df75c53f0", "source_file": "MAIB_2018_14_Wight_Sky_engine_bearing_fire.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/5b5217c7ed915d0b81e003df/MAIBInvReport14_2018.pdf", "source_kind": "report", "page": "14", "locator": "PDF page 14", "quote": "cluded that: ○ Debris in the engine’s oil channels was most probably responsible for initiating the failure. ○ When the shells of main bearing 5 turned, the lubrication supply to big end bearing 4 was blocked, resulting in destructive failure. • Rebuilding the engine in a clean and controlled environment and transferring it complete into the engine room would have reduced"}, "ev:166a2a0932391029": {"id": "ev:166a2a0932391029", "source_file": "MAIB_2026_06_Spirit_of_Discovery_propulsion_loss.pdf", "source_url": "https://www.gov.uk/maib-reports/loss-of-propulsion-in-heavy-weather-experienced-by-the-passenger-vessel-spirit-of-discovery-leading-to-over-100-injuries-and-one-fatality", "source_kind": "report", "page": "42", "locator": "PDF page 42", "quote": "ULSION 2.3.1 Initial loss of propulsion Spirit of Discovery was pitching heavily and rolling violently in 8m to 9m waves when its port pod automatically shut down, followed shortly afterwards by its starboard pod. After shutting down, each pod then automatically rotated and parked at 90° to the vessel’s heading. Given the weather conditions at the time, it is almost certain that Spirit of Discovery’s pitching caused the propellers to come"}, "ev:169a62f5f3bc2de6": {"id": "ev:169a62f5f3bc2de6", "source_file": "MAIB_2015_22_Pride_of_Canterbury_CPP_hydraulic_fire.pdf", "source_url": "https://assets.digital.cabinet-office.gov.uk/media/563092daed915d566d000002/MAIBInvReport-22_2015.pdf", "source_kind": "report", "page": "30", "locator": "PDF page 30", "quote": "from the OD box were protected. Critically, in the zone between the two starboard main engines where the leak occurred, there was no evidence after the fire of shielding on the flanged joints. Given the port side arrangement had no shielding for the same joints (Figure 19), it is concluded unlikely that shielding was ever in place on the starboard side. Although surveyed and inspected on a regular basis, the omission"}, "ev:16e773b397fb6388": {"id": "ev:16e773b397fb6388", "source_file": "MAIB_2013_Safety_Digest_lubrication_bearing_cases.pdf", "source_url": "https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/876748/2013-SD2-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "15", "locator": "PDF page 15", "quote": "ge the clutches. Although the starboard anchor was let go in an attempt to reduce the speed of approach, this did not prevent the ferry’s bow hitting her berth at a speed of 2.5kts and causing minor damage. Shortly after the impact, the engineers successfully re-engaged the port main engine clutch and the vessel was able to berth safely alongside, assisted by harbour tugs. Subsequent in"}, "ev:172a7fb8c0a27ceb": {"id": "ev:172a7fb8c0a27ceb", "source_file": "Frontiers_2021_marine_converter_oscillations.pdf", "source_url": "https://www.frontiersin.org/journals/energy-research/articles/10.3389/fenrg.2020.529756/pdf", "source_kind": "research_paper", "page": "1", "locator": "PDF page 1", "quote": "aneous frequency is determined and subsequently ﬂuctuations of fundamental components and chosen harmonics are calculated using zoom- DFT. The characteristics of these irregular ﬂuctuations are compared and commented on. Next, phase portraits and Poincare map of the registered voltages are calculated and compared. Moreover, the impact of ship rolling and pitching"}, "ev:17d803145e66029c": {"id": "ev:17d803145e66029c", "source_file": "Frontiers_2021_marine_converter_oscillations.pdf", "source_url": "https://www.frontiersin.org/journals/energy-research/articles/10.3389/fenrg.2020.529756/pdf", "source_kind": "research_paper", "page": "6", "locator": "PDF page 6", "quote": "otational speed of the prime mover is still present adding to the severity of ﬂuctuations due to waves. As a result, the depth of voltage and frequency modulations increase as well. For the presented example, the difference between maximum and minimum instantaneous frequency reaches 0.32 Hz or 0.32% of twice the system rated frequency. This is still below the recommended limit value of 0.5% ( IEEE Standard 4"}, "ev:18368950cc0f6b1b": {"id": "ev:18368950cc0f6b1b", "source_file": "Azimuth_Thruster_CBM_Dataset.zip", "source_url": "https://zenodo.org/records/20101612", "source_kind": "dataset", "page": "", "locator": "table3_lti_by_fault_type_anonymised.csv:row3", "quote": "System / engine-family case=CAT 3516C MPEB 3V; Fault or condition=High-harmonic impact train; Detection/event reference=Vibration alert Month -3.0; no oil sample; operational downtime event; Reference class=LTI_operational; LTI / warning (mo)=3.0; Warning (h)=450.0; Recommended CBM action=Vibration-only CBM; 125 h vibration interval; Included in mechanical LTI summary=yes"}, "ev:186ad5dbe0802ea5": {"id": "ev:186ad5dbe0802ea5", "source_file": "TSRF_main.zip", "source_url": "https://github.com/TS-RF/TSRF", "source_kind": "code", "page": "", "locator": "data/Head-crack.csv", "quote": "Head-crack.csv"}, "ev:188654e8f7b787d6": {"id": "ev:188654e8f7b787d6", "source_file": "MAIB_2013_Safety_Digest_lubrication_bearing_cases.pdf", "source_url": "https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/876748/2013-SD2-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "41", "locator": "PDF page 41", "quote": "ked rag to fall onto the hot manifold and catch fire. The small fire then ignited the engine high temperature alarm cabling loom, causing it to short circuit and set off the alarm in the wheelhouse (Figur n=Vibration-led CBM; 125 h vibration / 500 h oil; Included in mechanical LTI summary=yes"}, "ev:2caee49788bf31ab": {"id": "ev:2caee49788bf31ab", "source_file": "MAN_SL2019_685_ring_coating_wear.pdf", "source_url": "https://www.man-es.com/docs/default-source/service-letters/sl2019-685.pdf", "source_kind": "manufacturer_guidance", "page": "2", "locator": "PDF page 2", "quote": "ng, and so forth. The wear of the cermet coating can to some extent be assessed by analysis of drain oil samples. If these have a high iron content, the piston rings and the liners are worn correspondingly. Figure 2: Examples of piston ring packs with cermet coating Alu coating CL-groove Double S-lock Cermet High ring High ring High ring Alu coating CL-groove Double S-lock C"}, "ev:2cdda8701b9f350e": {"id": "ev:2cdda8701b9f350e", "source_file": "MAIB_2017_20_Hebrides_CPP_coupling.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/59b7ab1c40f0b61231e71a54/MAIBInvReport20_2017.pdf", "source_kind": "report", "page": "30", "locator": "PDF page 30", "quote": "CONTROL FAILURE MECHANISM It is evident from the inspection carried out by Hebrides’s engineers shortly after the accident, that control of the ferry’s port CPP was lost due to a mechanical failure within the linear servomotor actuator sited on the port gearbox (Figure 6). The setscrew used to secure one half of the jaw coupling to the stepper motor ‘D’ shaped shaft had backed off from the shaft’"}, "ev:2d11f04e90b4e6a9": {"id": "ev:2d11f04e90b4e6a9", "source_file": "STAMFORD_AGN039_marine_shaft_generators.pdf", "source_url": "https://www.stamford-avk.com/sites/stamfordavk/files/AGNs/AGN-039_C-Marine-Shaft-Generators.pdf", "source_kind": "manufacturer_guidance", "page": "2", "locator": "PDF page 2", "quote": "ator damaging vibration when the main engine is running at slow speeds and also when the ship is in storm conditions, because the ship’s hull flexes and so the gearbox to generator alignment becomes distorted. An experienced ship design engineer will know of these potential problems and will ensure that the coupling between gearbox and the shaft generator is a high quality, d"}, "ev:2d2994aad520a17a": {"id": "ev:2d2994aad520a17a", "source_file": "MAIB_2024_20_Stena_Europe_fuel_spray_fire.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/6756db0ba63e1781efb87793/2024-20-StenaEurope.pdf", "source_kind": "report", "page": "29", "locator": "PDF page 29", "quote": "MMENDATIONS 1. Stena Europe experienced a fire on one of its main engines due to an uncontrolled release of pressurised fuel. The fuel sprayed onto the exposed exhaust manifold that was operating at a temperature exceeding 220°C when a screw in a two-screw flange within the fuel oil pipework loosened. [2.2] 2. The fuel oil spray was allowed to reach the hot surface because the joint was not protected by"}, "ev:2d4645410e75d447": {"id": "ev:2d4645410e75d447", "source_file": "MAN_main_engine_auxiliary_efficiency.pdf", "source_url": "https://www.man-es.com/docs/default-source/document-sync/efficiency-improvements-main-engine-auxiliary-systems-eng.pdf", "source_kind": "manufacturer_guidance", "page": "11", "locator": "PDF page 11", "quote": "ion and thereby increase cylinder wear. – Increased scavenge air temperature which will lead to increased fuel oil consumption. – A flow which is too low may cause local boiling on the water side inside the scavenge air cooler, which may lead to cavitation in the cooling water pipes. – The stated max. scavenge air temperature values given in the technical file may be exceeded, and the engine may thereby"}, "ev:2d8d8f05ec0d8390": {"id": "ev:2d8d8f05ec0d8390", "source_file": "MAIB_2016_Safety_Digest_generator_oil_fire.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/5e81e5d2d3bf7f13416961fa/2016-SD1-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "21", "locator": "PDF page 21", "quote": "tective covers over safety- critical buttons, switches and knobs. nator’s insulation system. The disconnect times are achieved by the engineer responsible for selecting a circuit breaker, which has the appropriate adjustable tripping characteristics that can be set to ensure complia"}, "ev:45cb3bc7993a557f": {"id": "ev:45cb3bc7993a557f", "source_file": "MAIB_2022_04_Wight_Sky_multiple_engine_failures.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/6267cc85e90e071690c1b679/2022-4-WightSky-Report.pdf", "source_kind": "report", "page": "84", "locator": "PDF page 84", "quote": "y’s ME4 failed catastrophically because of an assembly error during build at Volvo Penta’s factory in Sweden. Two of the engine’s matched connecting rod big end bearing caps had been transposed during the engine assembly process. [2.3.2] 4. The transposition of the bearing caps reduced the metal-to-metal contact between surfaces of the connecting rods and their bearing caps. This would have caused fr"}, "ev:45f3ae7b802f6792": {"id": "ev:45f3ae7b802f6792", "source_file": "MAIB_2015_22_Pride_of_Canterbury_CPP_hydraulic_fire.pdf", "source_url": "https://assets.digital.cabinet-office.gov.uk/media/563092daed915d566d000002/MAIBInvReport-22_2015.pdf", "source_kind": "report", "page": "29", "locator": "PDF page 29", "quote": "he accident as a basis for making recommendations to prevent similar accidents occurring in the future. 2.2 CAUSE OF THE FIRE The fire was initiated following the spray of hydraulic oil, from a ruptured pipework joint in the starboard CPP system, onto the hot exhaust uptakes of the starboard main engines. The flanged joint ruptured because the CPP system became over- pressurised as a result of t"}, "ev:46c70849c9c28abc": {"id": "ev:46c70849c9c28abc", "source_file": "STAMFORD_AGN039_marine_shaft_generators.pdf", "source_url": "https://www.stamford-avk.com/sites/stamfordavk/files/AGNs/AGN-039_C-Marine-Shaft-Generators.pdf", "source_kind": "manufacturer_guidance", "page": "2", "locator": "PDF page 2", "quote": "When the shaft generator is aligned with the gearbox drive shaft, the ships design engineer must take great care to allow for the thermal expansion of the hot gearbox, which may well expand and lift the shaft centre line by < 1 mm. If the alignment is not accurate, then excessive vibration is likely to damage the shaft generator. There can also be lots of generator damaging vibration when the"}, "ev:470e8782d7a79377": {"id": "ev:470e8782d7a79377", "source_file": "MAIB_2015_22_Pride_of_Canterbury_CPP_hydraulic_fire.pdf", "source_url": "https://assets.digital.cabinet-office.gov.uk/media/563092daed915d566d000002/MAIBInvReport-22_2015.pdf", "source_kind": "report", "page": "29", "locator": "PDF page 29", "quote": "t in the starboard CPP system, onto the hot exhaust uptakes of the starboard main engines. The flanged joint ruptured because the CPP system became over- pressurised as a result of the back pressure valve (PSV3) becoming jammed in the closed position. The reason for the temporary increase in the starboard main engine load to 100% and corresponding increase in turbocharger rpm has not been det"}, "ev:471026a1392177a8": {"id": "ev:471026a1392177a8", "source_file": "MAIB_2021_02_Finlandia_Seaways_connecting_rod_failure.pdf", "source_url": "https://www.gov.uk/maib-reports/engine-failure-and-subsequent-fire-on-ro-ro-cargo-vessel-finlandia-seaways-with-1-person-injured", "source_kind": "report", "page": "9", "locator": "PDF page 9", "quote": "1 SYNOPSIS At 2003 on 16 April 2018, the Lithuanian registered ro-ro cargo vessel Finlandia Seaways suffered a catastrophic main engine failure that caused serious structural damage to the engine and a fire in the engine room. The vessel’s third engineer, who was on duty in the engine room at the time, suffered serious smoke-related lung, kidney and eye injuries during his escape. Finlandia Seaways was 11nm east of Lowestoft on a re"}, "ev:4812bf9684b2b7ad": {"id": "ev:4812bf9684b2b7ad", "source_file": "MAIB_2016_Safety_Digest_generator_oil_fire. n Societies to: • Establish a requirement for all new vessels fitted with harmo"}, "ev:4925b6b6f40f4c21": {"id": "ev:4925b6b6f40f4c21", "source_file": "MAIB_2016_Safety_Digest_generator_oil_fire.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/5e81e5d2d3bf7f13416961fa/2016-SD1-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "26", "locator": "PDF page 26", "quote": "a loose plug on the generator’s engine-mounted lubricating oil pump (Figure 2a). This had vibrated loose as a result of it being insufficiently tightened by shore staff during a recent dry dock. • A section of the adjacent generator’s exhaust piping had been left unlagged following its overhaul during the recent dry dock (Figure 2b). This was hidden from view by the exhaust casing. • Fine oil sp"}, "ev:4a59b715e39bd236": {"id": "ev:4a59b715e39bd236", "source_file": "Marine_Engine_Fault_Data_v1.zip", "source_url": "https://zenodo.org/records/19857425", "source_kind": "dataset", "page": "", "locator": "dataset_index.csv:AC_Fouling/AC_Fouling_40_Load.csv", "quote": "file_name=AC_Fouling/AC_Fouling_40_Load.csv; schema_type=scenario; scenario=Air-cooler fouling; nominal_load=40%; severity_or_program=single load condition; header_rows=3; data_rows=4678; columns=73; anomaly_state=binary (0=pre-anomaly, 1=anomaly); notes=Pre-anomaly and anomaly segments."}, "ev:4cdcbf4e0a149c7e": {"id": "ev:4cdcbf4e0a149c7e", "source_file": "MAN_SL2016_623_cooling_water.pdf", "source_url": "https://www.man-es.com/docs/default-source/service-letters/sl2016-623.pdf", "source_kind": "manufacturer_guidance", "page": "2", "locator": "PDF page 2", "quote": "t in thermal overload of the components to be cooled by the engine cooling water. A thermal overload may, however, also result in cracks and leakages as seen in the exhaust valve seat ring. Insufficient cooling water flow has widespread consequenc - es, in many cases this will influence the combustion process as well and therefore the overall performance a ines to stop the affected engine when a high oil temperature alarm activates, and not to restart the engine until the reason for the alarm has been determined. • Identified lessons to be learned from the accident and emergency response that will be highlighted in future crew training. • Programmed additio"}, "ev:a2b206da94882af3": {"id": "ev:a2b206da94882af3", "source_file": "MAIB_2016_Safety_Digest_generator_oil_fire.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/5e81e5d2d3bf7f13416961fa/2016-SD1-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "19", "locator": "PDF page 19", "quote": "y from the berth. The master’s actions proved ineffective as the vessel tore through the linkspan at a speed of about 7 knots and made heavy contact with the concrete berth (Figure 3). Almost immediately, bilge alarms, indicating water ingress into the vessel’s forward spaces, began to sound. The pitch on both propellers was brought to zero but the main engines were kept running. The bridge team mad"}, "ev:a33dab8e3476ce99": {"id": "ev:a33dab8e3476ce99", "source_file": "MAIB_2016_Safety_Digest_generator_oil_fire.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/5e81e5d2d3bf7f13416961fa/2016-SD1-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "20", "locator": "PDF page 20", "quote": "tarboard CPP back-up control mode was inadvertently selected, the master lost bridge control of that propeller. The starboard CPP continued to thrust at over half ahead throughout the vessel’s approach to the berth and up until its engine was stopped (about 2 hours after the contact). Starboard pitch back-up on/off control button Centre console lamps dimmer control buttons Figure 1: Part of brid"}, "ev:a36fbb3ebb9e478c": {"id": "ev:a36fbb3ebb9e478c", "source_file": "MAIB_2016_Safety_Digest_generator_oil_fire.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/5e81e5d2d3bf7f13416961fa/2016-SD1-MAIBSafetyDigest.pdf", "source_kind": "repor m/TS-RF/TSRF", "source_kind": "code", "page": "", "locator": "data/Ring-wear.csv", "quote": "Ring-wear.csv"}, "ev:a61057fac0fe1035": {"id": "ev:a61057fac0fe1035", "source_file": "MAIB_2026_06_Spirit_of_Discovery_propulsion_loss.pdf", "source_url": "https://www.gov.uk/maib-reports/loss-of-propulsion-in-heavy-weather-experienced-by-the-passenger-vessel-spirit-of-discovery-leading-to-over-100-injuries-and-one-fatality", "source_kind": "report", "page": "51", "locator": "PDF page 51", "quote": "e vessel. [2.3.1] 3. The loss of control was exacerbated by the initiation of the pod’s water leakage stop sequence, which led to both pods being parked at 90° to the vessel’s heading. This caused the vessel to lose steerage, its bow to swing to port and its motion to become even more severe. [2.3.1] 4. The vessel’s propulsion control system was unable to prevent the loss of propulsion when its movement was wi"}, "ev:a67a93bfec361edf": {"id": "ev:a67a93bfec361edf", "source_file": "MAIB_2022_04_Wight_Sky_multiple_engine_failures.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/6267cc85e90e071690c1b679/2022-4-WightSky-Report.pdf", "source_kind": "report", "page": "84", "locator": "PDF page 84", "quote": "y due to a sudden loss of lubricating oil supply to its number five main journal bearing and number four crankpin. [2.3.1] 2. The oilway to the main journal and crankpin was blocked off when the bearing shells turned in their housing. Poor fuel combustion, the presence of silica sand and other abrasive particles embedded in the main bearing shells, engine misalignment, high levels of vibration, and contaminated lubricating oil might all have"}, "ev:a6b5f4147115c639": {"id": "ev:a6b5f4147115c639", "source_file": "MAN_SL2013_569_bearing_wear_monitoring.pdf", "source_url": "https://www.man-es.com/docs/default-source/service-letters/sl2013-569.pdf", "source_kind": "manufacturer_guidance", "page": "2", "locator": "PDF page 2", "quote": "g wear monitoring (BWM) system oltage is larger than 300 millivolts peak, bearing insulation should be"}, "ev:aee93ed7c1866eb1": {"id": "ev:aee93ed7c1866eb1", "source_file": "MAIB_2016_Safety_Digest_generator_oil_fire.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/5e81e5d2d3bf7f13416961fa/2016-SD1-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "21", "locator": "PDF page 21", "quote": "id not fully understand the vessel’s propulsion control system and had not routinely tested their back-up and emergency controls. Regular testing of back-up and emergency control systems, and the conduct of machinery breakdown drills, provide the most effective method of ensuring the crew fully understand their ship’s systems and are best prepared to respond in an emergency. Figure 3: Damage to linkspan, mooring"}, "ev:af6ff177f229c6a2": {"id": "ev:af6ff177f229c6a2", "source_file": "MAIB_2011_28_Queen_Mary_2_harmonic_filter_failure.pdf", "source_url": "https://assets.digital.cabinet-office.gov.uk/media/547c6fa6ed915d4c10000031/QM2Report.pdf", "source_kind": "report", "page": "13", "locator": "PDF page 13", "quote": "e suppression spray heads were activated, one in the aft harmonic filter room and the other in the aft main switchboard room. The explosion was triggered by deterioration in the capacitors in the aft HF . Internal arcing between the capacitor plates developed, which vaporised the dielectric medium causing the internal pressure to increase, until it caused the capacitor casing to rupture. Dielectric fluid vapour spr"}, "ev:b0b9daf02ad1af6f": {"id": "ev:b0b9daf02ad1af6f", "source_file": "MAIB_2024_20_Stena_Europe_fuel_spray_fire.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/6756db0ba63e1781efb87793/2024-20-StenaEurope.pdf", "source_kind": "report", "page": "7", "locator": "PDF page 7", "quote": "noperative for several weeks. The fire was caused by fuel leaking under pressure from the fuel system of main engine number 3 and igniting on an exposed hot surfa 1", "quote": "ate without any problems and the vessel undertook several voyages. However, after the engine failure, the duplex filter was found without a filter cartridge in the on-line filter chamber, and the engine lubricating oil system was contaminated. The contamination caused main bearing seizure, the rotation of bearing shells and the blockage of oil ways, and subsequent oil starvation and"}, "ev:b1d5068e305409aa": {"id": "ev:b1d5068e305409aa", "source_file": "MAIB_2015_22_Pride_of_Canterbury_CPP_hydraulic_fire.pdf", "source_url": "https://assets.digital.cabinet-office.gov.uk/media/563092daed915d566d000002/MAIBInvReport-22_2015.pdf", "source_kind": "report", "page": "29", "locator": "PDF page 29", "quote": "recommendations to prevent similar accidents occurring in the future. 2.2 CAUSE OF THE FIRE The fire was initiated following the spray of hydraulic oil, from a ruptured pipework joint in the starboard CPP system, onto the hot exhaust uptakes of the starboard main engines. The flanged joint ruptured because the CPP system became over- pressurised as a result of the back pressure valve (PSV3) becoming jammed in"}, "ev:b2ab413559094e03": {"id": "ev:b2ab413559094e03", "source_file": "MAIB_2021_02_Finlandia_Seaways_connecting_rod_failure.pdf", "source_url": "https://www.gov.uk/maib-reports/engine-failure-and-subsequent-fire-on-ro-ro-cargo-vessel-finlandia-seaways-with-1-person-injured", "source_kind": "report", "page": "56", "locator": "PDF page 56", "quote": "workshops in Klaipeda. Despite this, seven of the intact 11 small ends removed from Finlandia Seaways’ engine were found to have notch damage on the internal surfaces of their small end eyes. Three of Botnia Seaways’ small ends had similar damage and three had evidence of localised heat damage. Although the technical investigations did not identify when the damage had been done, it was clearly apparent that it had be"}, "ev:b44d9524e09bf0ac": {"id": "ev:b44d9524e09bf0ac", "source_file": "Marine_Engine_Fau our tugs. Subsequent investigation identified that No2 compressor had a damaged discharge valve. Neither compressor had been able to keep up with demand."}, "ev:c1d3874bb4a2345c": {"id": "ev:c1d3874bb4a2345c", "source_file": "MAIB_2011_28_Queen_Mary_2_harmonic_filter_failure.pdf", "source_url": "https://assets.digital.cabinet-office.gov.uk/media/547c6fa6ed915d4c10000031/QM2Report.pdf", "source_kind": "report", "page": "13", "locator": "PDF page 13", "quote": "room. Within a few seconds, all four propulsion motors shut down, and the vessel blacked out shortly afterwards. Fortunately, the vessel was clear of navigational hazards and drifted in open sea. The emergency generator started automatically and provided essential supplies to the vessel, and it wa s qu ickly es tablished th at th e ex plosion ha d ta ken pl ace in th e af t ha rmonic filter (HF) room, situated within the"}, "ev:c2745665875d9964": {"id": "ev:c2745665875d9964", "source_file": "MAIB_2018_14_Wight_Sky_engine_bearing_fire.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/5b5217c7ed915d0b81e003df/MAIBInvReport14_2018.pdf", "source_kind": "report", "page": "14", "locator": "PDF page 14", "quote": "the shells of main bearing 5 turned, the lubrication supply to big end bearing 4 was blocked, resulting in destructive failure. • Rebuilding the engine in a clean and controlled environment and transferring it complete into the engine room would have reduced the likelihood of debris ingress. • The engine was not fitted with a wear detector, so there was no means of receiving a warning before the engine failed. • The"}, "ev:c2f0061fd7fa1953": {"id": "ev:c2f0061fd7fa1953", "source_file": "MAIB_2015_22_Pride_of_Canterbury_CPP_hydraulic_fire.pdf", "source_url": "https://assets.digital.cabinet-office.gov.uk/media/563092daed915d566d000002/MAIBInvReport-22_2015.pdf", "source_kind": "report", "page": "29", "locator": "PDF page 29", "quote": "ation of the CPP system as it maintained the overall system pressure. When this component failed to operate correctly, there were no means within the system to effectively relieve excess pressure. In addition, pressure safety valve (PSV1), which enabled pressure to be dissipated into the return line, was set to operate at 145 bar. This was significantly higher than the pressure at which some parts of the system were able"}, "ev:c31d55ce6b8d61c0": {"id": "ev:c31d55ce6b8d61c0", "source_file": "Marine_Engine_Fault_Data_v1.zip", "source_url": "https://zenodo.org/records/19857425", "source_kind": "dataset", "page": "", "locator": "variable_dictionary.csv:Fresh Cooling Water Press.", "quote": "full_name=Fresh Cooling Water Press.; symbol=Pl_water1; unit=V; dtype=number; in_reference=TRUE; in_scenario_files=TRUE; category=pressure / derived pressure; note=raw voltage signal associated with HT cooling-water pump pressure; not converted to engineering pressure units"}, "ev:c3429f0fc22579e1": {"id": "ev:c3429f0fc22579e1", "source_file": "MAIB_2026_06_Spirit_of_Discovery_propulsion_loss.pdf", "source_url": "https://www.gov.uk/maib-reports/loss-of-propulsion-in-heavy-weather-experienced-by-the-passenger-vessel-spirit-of-discovery-leading-to-over-100-injuries-and-one-fatality", "source_kind": "report", "page": "42", "locator": "PDF page 42", "quote": "e vessel’s heading. Given the weather conditions at the time, it is almost certain that Spirit of Discovery’s pitching caused the propellers to come out of the water. This caused a sudden reduction in torque on the propulsion motor and led to a very rapid increase in the motors’ rpm. The engine alarm and monitoring system recorded that, immediately before their shutdown, the rpm of each pod’s"}, "ev:c4dfa47c81f2ebb5": {"id": "ev:c4dfa47c81f2ebb5", "source_file": "MAIB_2021_02_Finlandia_Seaways_connecting_rod_failure.pdf", "source_url": "https://www.gov.uk/maib-reports/engine-failure-and-subsequent-fire-on-ro-ro-cargo-vessel-finlandia-seaways-with-1-person-injured", "source_kind": "report", "page": "56", "locator": "PDF page 56", "quote": "48 recommended procedures for overhauling the connecting rod small ends had not been followed, and the small ends had been damaged during the piston pin bush removal and fitting process. The extent of the damage was clearly visible to the naked eye but was either not identified during the engine/component overhauls or was"}, "ev:c6b798ec4934dc08": {"id": "ev:c6b798ec4934dc08", "source_file": "MAIB_2013_Safety_Digest_lubrication_bearing_cases.pdf", "source_url": "https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/876748/2013-SD2-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "41", "locator": "PDF page 41", "quote": "iling checks, he wiped the engine sump dipstick on a rag, which he casually left on a tank top above the engine exhaust manifold. Vibration caused the oil-soaked rag to fall onto the hot manifold and catch fire. The small fire then ignited the engine high temperature alarm cabling loom, causing it to short circuit and set off the alarm in the wheelhouse (Figure 2). The functional fire and smoke alarm"}, "ev:c74257f47f29e86a": {"id": "ev:c74257f47f29e86a", "source_file": "MAIB_2022_04_Wight_Sky_multiple_engine_failures.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/6267cc85e90e071690c1b679/2022-4-WightSky-Report.pdf", "source_kind": "report", "page": "72", "locator": "PDF page 72", "quote": "ble to determine why the technician made such a basic error. However, the engine manufacturer’s investigation identified that the serial numbers on the connecting rods and caps were not routinely checked to ensure that they matched following assembly. To mitigate the risk of similar errors, Volvo Penta introduced an improved method of identifying and matching the connecting rods into its production process. 2.4 OTHER WIGHT CLASS"}, "ev:c7e7236b07b0d8d2": {"id": "ev:c7e7236b07b0d8d2", "source_file": "MAIB_2026_06_Spirit_of_Discovery_propulsion_ .pdf", "source_kind": "manufacturer_guidance", "page": "2", "locator": "PDF page 2", "quote": "to polishing and, possibly, smearing of the surface. When the liner surface is smeared, the open graphite lamel - las are closed making it difficult to keep a proper oil film. When the oil film is compromised, the cast iron piston rings, which are in contact with the cast iron liner, may generate high friction and seizures that will not recover (liner scuffing). During scuffing, the surface of the lin"}, "ev:ec533ae27276b674": {"id": "ev:ec533ae27276b674", "source_file": "MAIB_2016_Safety_Digest_generator_oil_fire.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/5e81e5d2d3bf7f13416961fa/2016-SD1-MAIBSafetyDigest.pdf", "source_kind": "report", "page": "29", "locator": "PDF page 29", "quote": "rried out. These drills will give operators confidence in the back-up systems and help them react effectively in an emergency. 3. Frequent engine response tests should be completed, both ahead and astern. This is particularly important before entering and leaving port or congested waters"}, "ev:ed4a18d326cb49be": {"id": "ev:ed4a18d326cb49be", "source_file": "MAIB_2021_02_Finlandia_Seaways_connecting_rod_failure.pdf", "source_url": "https://www.gov.uk/maib-reports/engine-failure-and-subsequent-fire-on-ro-ro-cargo-vessel-finlandia-seaways-with-1-person-injured", "source_kind": "report", "page": "9", "locator": "PDF page 9", "quote": "used to replace the connecting rod small end piston pin bearing bushes by the vessel manager’s maintenance support contractor had introduced stress raisers that signficantly increased the likelihood of crack initiation and fatigue failure. Other factors that contributed to the engine failure included: standards of maintenance management; lack of appreciation of the importance of following the engine manufacturer’s instructions for the removal and refitting of the"}, "ev:f17ab4bbdcec2bfc": {"id": "ev:f17ab4bbdcec2bfc", "source_file": "MAIB_ asing (Figure 2) disabled the ship for a month and cost a six-figure sum to repair. To Turn"}, "ev:f4ea99f2d07cb7c1": {"id": "ev:f4ea99f2d07cb7c1", "source_file": "MAIB_2011_28_Queen_Mary_2_harmonic_filter_failure.pdf", "source_url": "https://assets.digital.cabinet-office.gov.uk/media/547c6fa6ed915d4c10000031/QM2Report.pdf", "source_kind": "report", "page": "13", "locator": "PDF page 13", "quote": "en Mary 2 (QM2) was approaching Barcelona, an explosion occurred in the vessel’s aft main switchboard room. Within a few seconds, all four propulsion motors shut down, and the vessel blacked out shortly afterwards. Fortunately, the vessel was clear of navigational hazards and drifted in open sea. The emergency generator started automatically and provided essential supplies to the vessel, and i"}, "ev:f55562c55772b4c1": {"id": "ev:f55562c55772b4c1", "source_file": "MAIB_2018_01_Windcat8_bearing_failure_fire.pdf", "source_url": "https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/683922/MAIBInvReport01_2018.pdf", "source_kind": "report", "page": "11", "locator": "PDF page 11", "quote": "lure warranted a more cautious approach to the use of the engine until a deeper technical investigation could be conducted. • The fire resulted from the ignition of oil vapour released from the damaged crankcase and did not spread beyond the port engine. • The fixed fire-fighting system was rendered ineffective because not all the port engine space vents were closed prior to its release. • The safety of the embarked technicians was given"}, "ev:f586cbe874297cd1": {"id": "ev:f586cbe874297cd1", "source_file": "MAIB_2022_04_Wight_Sky_multiple_engine_failures.pdf", "source_url": "https://assets.publishing.service.gov.uk/media/6267cc85e90e071690c1b679/2022-4-WightSky-Report.pdf", "source_kind": "report", "page": "84", "locator": "PDF page 84", "quote": "main journal and crankpin was blocked off when the bearing shells turned in their housing. Poor fuel for(const n of cases){let o=document.createElement('option');o.value=n.props.case_id||n.props.knowledge_id;o.textContent=(n.props.knowledge_id?'机理｜':'事故｜')+n.name;sel.append(o)}sel.value='knowledge:liner_scuffing';

function render(){let edges=E.filter(e=>e.case_id===sel.value&&(mode.value==='all'||(mode.value==='causal'?CAUSAL:DIAG).includes(e.relation)));let ids=[...new Set(edges.flatMap(e=>[e.source,e.target]))];let indegree=Object.fromEntries(ids.map(id=>[id,0])),level=Object.fromEntries(ids.map(id=>[id,0]));for(const e of edges)indegree[e.target]++;let q=ids.filter(id=>!indegree[id]);for(let i=0;i<q.length;i++){let a=q[i];for(const e of edges.filter(e=>e.source===a)){level[e.target]=Math.max(level[e.target],level[a]+1);if(--indegree[e.target]===0)q.push(e.target)}}

let defs=el('defs'),marker=el('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(el('path',{d:'M0,0 L10,5 L0,10 z',fill:'#7b8d9e'}));defs.append(marker);svg.append(defs);svg.append(el('text',{x:30,y:27,fill:'#52677d'},`${edges.length} 条关系，${ids.length} 个实体 · ${cases.find(n=>(n.props.case_id||n.props.knowledge_id)===sel.value).name}`));
edges.forEach((e,i)=>{let a=pos[e.source],b=pos[e.target],forward=b.x>a.x;let x1=a.x+180,y1=a.y+33,x2=b.x,y2=b.y+33;if(!forward){x1=a.x+90;y1=a.y+66;x2=b.x+90;y2=b.y;}
const backwards=b.x<a.x&&b.y===a.y;const vertical=b.x===a.x&&b.y>a.y;if(backwards){x1=a.x;y1=a.y+33;x2=b.x+180;y2=b.y+33;}let d=forward?`M${x1},${y1} C${x1+45},${y1} ${x2-45},${y2} ${x2-8},${y2}`:`M${x1},${y1} C${x1+70},${y1+30} ${x2+70},${y2-30} ${x2},${y2-8}`;if(backwards)d=`M${x1},${y1} C${x1-20},${y1} ${x2+20},${y2} ${x2+8},${y2}`;if(vertical)d=`M${x1},${y1} C${x1},${y1+30} ${x2},${y2-30} ${x2},${y2-8}`;let path=el('path',{d,fill:'none',stroke:'#8da0af','stroke-width':1.5,'marker-end':'url(#arrow)',class:'edge'});path.addEventListener('click',()=>detailsEdge(e));let title=el('title',{},e.caption+' · '+e.certainty_zh);path.append(title);svg.append(path);let t=el('text',{x:forward||backwards?(x1+x2)/2:x1+25,y:(y1+y2)/2-6+(i%3-1)*9,'text-anchor':'middle',class:'edge edge-label'},e.caption);t.addEventListener('click',()=>detailsEdge(e));svg.append(t)});
for(const id of ids){let n=N[id],p=pos[id],g=el('g',{class:'node'});g.append(el('rect',{x:p.x,y:p.y,width:180,height:66,rx:9,fill:COLORS[n.kind]||'#cbd5e1',stroke:'#e2e8f0'}));let txt=n.props.display_name||n.name;let chunks=txt.match(/.{1,13}/gu)||[''];chunks.forEach((s,i)=>g.append(el('text',{x:p.x+90,y:p.y+20+i*17,'text-anchor':'middle'},s)));g.append(el('title',{},n.name+' · '+KINDS[n.kind]));g.addEventListener('click',()=>{info.textContent=`实体：${n.name}\n类型：${KINDS[n.kind]} (${n.kind})\nID：${n.id}\n别名：${n.aliases}\n属性：${JSON.stringify(n.props,null,2)}`});svg.append(g)}info.textContent=(cases.find(n=>(n.props.case_id||n.props.knowledge_id)===sel.value).props.applicability||'历史案例，不能直接推定本船根因')+'\n点击关系可查看原文依据。此图为静态快照，实时状态以Neo4j为准。';}
